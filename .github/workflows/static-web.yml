name: Build and Deploy Web Playground

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies & Build SCSS
        run: |
          bun install
          bun run build

      - name: Create index.html for preview
        run: |
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
              <meta charset="utf-8">
              <title>Material 3 Preview</title>
              <link rel="stylesheet" href="./material3.css">
              <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body>
              <div style="padding: 20px;">
                  <h1>LuCI Material 3 Mod Preview</h1>
                  <p>Trang xem trước CSS/Theme đã build thành công!</p>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
