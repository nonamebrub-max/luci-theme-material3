name: Build and Deploy LuCI Theme M3

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Compile SCSS
        run: |
          npm install
          mkdir -p dist/luci-static/material3
          # Biên dịch đúng file cascade.scss ra cascade.css
          npx sass styles/cascade.scss dist/luci-static/material3/cascade.css --no-source-map

      - name: Copy full htdocs assets
        run: |
          if [ -d "htdocs" ]; then
            cp -r htdocs/* dist/
          fi

      - name: Generate Index Preview Page
        run: |
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
          <meta charset="utf-8">
          <title>luci-theme-material3 Preview</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="./luci-static/material3/cascade.css">
          <style>
            body { font-family: sans-serif; background: #fdf8ff; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
            .preview-card { background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); width: 100%; max-width: 400px; }
            h2 { margin-top: 0; color: #6750A4; }
            .btn { background: #6750A4; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 12px; }
          </style>
          </head>
          <body>
          <div class="preview-card">
              <h2>Material 3 Theme</h2>
              <p>Biên dịch thành công từ <code>styles/cascade.scss</code>!</p>
              <button class="btn" onclick="alert('Material 3 Active!')">Test Style</button>
          </div>
          </body>
          </html>
          EOF

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
