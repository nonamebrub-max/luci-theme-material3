name: Deploy theme preview (real LuCI)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  OWRT_IMAGE: openwrt/rootfs:x86-64-openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build SCSS
        run: |
          mkdir -p build/luci-static/material3
          npx sass styles/cascade.scss build/luci-static/material3/cascade.css --no-source-map

      - name: Start OpenWrt container and install LuCI
        run: |
          docker run -d --name owrt -p 8080:80 "$OWRT_IMAGE" sleep infinity
          docker exec owrt mkdir -p /var/lock /var/run/ubus
          docker exec owrt cat /etc/resolv.conf
          docker exec owrt sed -i 's#https://#http://#g' /etc/opkg/distfeeds.conf
          docker exec owrt sh -c 'opkg update && opkg install luci'

      - name: Install theme and start LuCI services
        run: |
          docker cp htdocs/. owrt:/www/
          docker cp build/luci-static/material3/cascade.css owrt:/www/luci-static/material3/cascade.css
          docker exec owrt mkdir -p /usr/share/ucode/luci/template/themes
          docker cp ucode/template/themes/material3 owrt:/usr/share/ucode/luci/template/themes/
          docker cp root/. owrt:/ || true

          docker exec owrt sh -c '
            uci set luci.themes.Material3=/luci-static/material3
            uci set luci.main.mediaurlbase=/luci-static/material3
            uci commit luci
            printf "root\nroot\n" | passwd root
            rm -rf /tmp/luci-*
          '

          # Tự bật daemon, không dùng procd/init
          docker exec -d owrt ubusd -s /var/run/ubus/ubus.sock
          sleep 2
          docker exec -d owrt rpcd -s /var/run/ubus/ubus.sock
          docker exec -d owrt logd
          sleep 2
          docker exec -d owrt uhttpd -f -h /www -r OpenWrt -x /cgi-bin \
            -u /ubus -U /var/run/ubus/ubus.sock \
            -t 60 -T 30 -k 20 -A 1 -n 3 -N 100 -R -p 0.0.0.0:80

      - name: Wait for LuCI
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/cgi-bin/luci/ >/dev/null && echo "LuCI up" && exit 0
            sleep 2
          done
          docker logs owrt | tail -n 50
          echo "::error::LuCI không lên"; exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          mkdir -p dist/shots
          cat > shots.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'http://localhost:8080';
          const pages = [
            ['status',   '/cgi-bin/luci/admin/status/overview'],
            ['network',  '/cgi-bin/luci/admin/network/network'],
            ['wireless', '/cgi-bin/luci/admin/network/wireless'],
            ['firewall', '/cgi-bin/luci/admin/network/firewall'],
            ['system',   '/cgi-bin/luci/admin/system/system'],
            ['syslog',   '/cgi-bin/luci/admin/status/logs'],
          ];
          const viewports = {
            desktop: { width: 1366, height: 850 },
            mobile:  { width: 390,  height: 844 },
          };
          const schemes = ['light', 'dark'];

          const browser = await chromium.launch();
          const shots = [];

          for (const scheme of schemes) {
            for (const [vpName, viewport] of Object.entries(viewports)) {
              const ctx = await browser.newContext({ viewport, colorScheme: scheme });
              const page = await ctx.newPage();

              await page.goto(base + '/cgi-bin/luci/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(800);
              const loginFile = `login-${vpName}-${scheme}.png`;
              await page.screenshot({ path: `dist/shots/${loginFile}` });
              shots.push({ name: 'login', vpName, scheme, file: loginFile });

              await page.fill('input[name="luci_username"]', 'root');
              await page.fill('input[type="password"]', 'root');
              await page.press('input[type="password"]', 'Enter');
              await page.waitForLoadState('networkidle');

              for (const [name, path] of pages) {
                try {
                  await page.goto(base + path, { waitUntil: 'networkidle' });
                  await page.waitForTimeout(1200);
                  const file = `${name}-${vpName}-${scheme}.png`;
                  await page.screenshot({ path: `dist/shots/${file}`, fullPage: true });
                  shots.push({ name, vpName, scheme, file });
                } catch (e) {
                  console.warn(`skip ${name}: ${e.message}`);
                }
              }
              await ctx.close();
            }
          }
          await browser.close();

          const card = s => `<figure><img loading="lazy" src="shots/${s.file}"><figcaption>${s.name} · ${s.vpName} · ${s.scheme}</figcaption></figure>`;
          fs.writeFileSync('dist/index.html', `<!DOCTYPE html>
          <html lang="vi"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>luci-theme-material3 preview</title>
          <style>
            body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#f4f1f8;color:#1c1b1f}
            h1{margin-top:0}
            .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
            figure{margin:0;background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px #0002}
            img{width:100%;border-radius:8px;display:block}
            figcaption{padding-top:8px;font-size:14px}
            @media(prefers-color-scheme:dark){body{background:#1c1b1f;color:#e6e1e5}figure{background:#2b2930}}
          </style></head><body>
          <h1>luci-theme-material3 — preview từ LuCI thật</h1>
          <div class="grid">${shots.map(card).join('')}</div>
          </body></html>`);
          EOF
          node shots.mjs
          touch dist/.nojekyll

      - name: Dump logs on failure
        if: failure()
        run: docker logs owrt | tail -n 100

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
