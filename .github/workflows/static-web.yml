name: Preview LuCI themes (spoofed as Xiaomi CR6608)

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      theme_repos:
        description: 'Link GitHub của theme (nhiều link cách nhau bằng dấu cách). Bỏ trống = repo này'
        type: string
        default: ''
      profile:
        description: 'full = khoảng 30 trang, quick = 6 trang chính'
        type: choice
        options: [full, quick]
        default: full
      fail_on_error:
        description: 'Job đỏ nếu có lỗi (vẫn deploy trước khi báo đỏ)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OWRT_IMAGE: openwrt/rootfs:x86-64-openwrt-24.10
  EXTRA_PKGS: luci-app-sqm luci-app-upnp luci-app-ddns luci-app-wol
  CACHE_VERSION: v3
  CHECK_CONTRAST: 'true'
  MAX_THEMES: '3'
  KEEP_PREVIEWS: '30'
  # --- Router giả lập ---
  SPOOF_MODEL: 'Xiaomi Mi Router CR6608'
  SPOOF_BOARD: 'xiaomi,mi-router-cr6608'
  SPOOF_SOC: 'MediaTek MT7621 ver:1 eco:3'
  SPOOF_TARGET: 'ramips/mt7621'
  SPOOF_HOST: 'CR6608'
  SPOOF_RAM_MB: '256'
  PROFILE: ${{ inputs.profile || 'full' }}
  FAIL_ON_ERROR: ${{ inputs.fail_on_error && 'true' || 'false' }}

jobs:
  # ====================================================================
  # 0. Phân tích danh sách link
  # ====================================================================
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.p.outputs.targets }}
    steps:
      - id: p
        env:
          INPUT_REPOS: ${{ inputs.theme_repos }}
        run: |
          cat > plan.mjs <<'END_PLAN'
          const self = process.env.GITHUB_REPOSITORY;
          const raw = (process.env.INPUT_REPOS || '').trim();
          const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'theme';
          const bad = m => { console.error('::error::' + m); process.exit(1); };
          const NAME = /^[A-Za-z0-9_.-]+$/;
          const PATHRE = /^[A-Za-z0-9_.\/-]+$/;
          const out = [];
          if (!raw) {
            out.push({ repo: self, ref: process.env.GITHUB_SHA || '', subdir: '', slug: slugify(self) });
          } else {
            for (const tok of raw.split(/[\s,]+/).filter(Boolean)) {
              let s = tok.replace(/^https?:\/\/(www\.)?github\.com\//, '').replace(/\/+$/, '');
              let ref = '';
              const at = s.match(/^([^@]+)@(.+)$/);
              if (at) { s = at[1]; ref = at[2]; }
              const parts = s.split('/');
              if (parts.length < 2) bad('Link không hợp lệ: ' + tok);
              const owner = parts[0];
              const repo = parts[1].replace(/\.git$/, '');
              let subdir = '';
              if (parts[2] === 'tree' && parts[3]) { ref = ref || parts[3]; subdir = parts.slice(4).join('/'); }
              else if (parts.length > 2) bad('Chỉ hỗ trợ owner/repo, owner/repo@ref hoặc .../tree/<nhánh>/<thư mục>: ' + tok);
              if (!NAME.test(owner) || !NAME.test(repo)) bad('Tên repo không hợp lệ: ' + tok);
              if (ref && (!PATHRE.test(ref) || ref.includes('..'))) bad('Nhánh/tag không hợp lệ: ' + tok);
              if (subdir && (!PATHRE.test(subdir) || subdir.includes('..'))) bad('Thư mục con không hợp lệ: ' + tok);
              const slug = slugify(owner + '-' + repo + (subdir ? '-' + subdir.split('/').pop() : ''));
              out.push({ repo: owner + '/' + repo, ref, subdir, slug });
            }
          }
          const seen = new Set();
          const uniq = [];
          for (const t of out) {
            let s = t.slug, n = 2;
            while (seen.has(s)) s = t.slug + '-' + (n++);
            seen.add(s);
            uniq.push({ ...t, slug: s });
          }
          if (!uniq.length) bad('Không có link nào');
          if (uniq.length > 6) bad('Tối đa 6 link mỗi lần chạy');
          console.log(JSON.stringify(uniq));
          END_PLAN
          t=$(node plan.mjs)
          echo "targets=$t" >> "$GITHUB_OUTPUT"
          echo "$t"

  # ====================================================================
  # 1. Clone + build theme
  # ====================================================================
  build-theme:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone theme repository
        id: clone
        env:
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p src bundle
          cd src
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          if [ "$REPO" = "$GITHUB_REPOSITORY" ]; then
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=Authorization: Basic ${auth}" fetch --depth 1 origin "${REF:-HEAD}"
          else
            git fetch --depth 1 origin "${REF:-HEAD}"
          fi
          git checkout -q FETCH_HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='%h %s' || true

      - name: Record clone failure
        if: always() && steps.clone.outcome != 'success'
        run: |
          mkdir -p bundle
          echo '{"error":"Không clone được repository (sai tên, repo riêng tư hoặc sai nhánh/commit)"}' > bundle/meta.json
          echo '[{"l":"e","t":"Không clone được repository"}]' > bundle/static.json

      - name: Detect, build and analyze theme
        if: steps.clone.outcome == 'success'
        env:
          SHA: ${{ steps.clone.outputs.sha }}
          SUBDIR: ${{ matrix.subdir }}
        run: |
          mkdir -p tools bundle
          cat > tools/prepare.mjs <<'END_PREPARE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const [SRC, SUBDIR, OUT] = process.argv.slice(2);
          const findings = [];
          const add = (l, t) => { findings.push({ l, t }); console.log('[' + l + '] ' + t); };
          const ok = t => add('ok', t);
          const warn = t => add('w', t);
          const err = t => add('e', t);
          const meta = { sha: process.env.SHA || '', notes: [], candidates: [], themeDirs: [], staticDirs: [], tplDirs: [] };
          const exists = p => fs.existsSync(p);
          const read = p => fs.readFileSync(p, 'utf8');
          const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
          const SKIP = new Set(['node_modules', '.git']);
          fs.mkdirSync(OUT, { recursive: true });

          function save() {
            fs.writeFileSync(path.join(OUT, 'meta.json'), JSON.stringify(meta, null, 2));
            fs.writeFileSync(path.join(OUT, 'static.json'), JSON.stringify(findings, null, 2));
          }
          function stop(msg) { meta.error = msg; err(msg); save(); process.exit(0); }

          function walkDirs(r, depth, acc = []) {
            acc.push(r);
            if (depth <= 0) return acc;
            let ents = [];
            try { ents = fs.readdirSync(r, { withFileTypes: true }); } catch { return acc; }
            for (const e of ents) if (e.isDirectory() && !SKIP.has(e.name)) walkDirs(path.join(r, e.name), depth - 1, acc);
            return acc;
          }
          function walkFiles(r, filter, depth = 20, acc = []) {
            let ents = [];
            try { ents = fs.readdirSync(r, { withFileTypes: true }); } catch { return acc; }
            for (const e of ents) {
              const p = path.join(r, e.name);
              if (e.isDirectory()) { if (!SKIP.has(e.name) && depth > 0) walkFiles(p, filter, depth - 1, acc); }
              else if (e.isFile() && filter(p)) acc.push(p);
            }
            return acc;
          }
          const ls = d => { try { return fs.readdirSync(d, { withFileTypes: true }); } catch { return []; } };
          const isDirLike = e => e.isDirectory() || e.isSymbolicLink();
          const run = (cmd, cwd) => {
            console.log('$ ' + cmd + '   (cwd: ' + cwd + ')');
            const r = spawnSync('bash', ['-c', cmd], { cwd, stdio: 'inherit', timeout: 15 * 60 * 1000 });
            return r.status === 0;
          };

          const root = path.resolve(SRC);
          const rel = p => path.relative(root, p) || '.';
          let pkg;
          if (SUBDIR) {
            pkg = path.resolve(root, SUBDIR);
            if (!pkg.startsWith(root + path.sep) || !exists(pkg)) stop('Không thấy thư mục con: ' + SUBDIR);
          } else {
            const isPkg = d => ['htdocs/luci-static', 'ucode/template/themes', 'luasrc/view/themes'].some(p => exists(path.join(d, p)));
            const score = d => {
              let s = 0;
              if (exists(path.join(d, 'htdocs/luci-static'))) s += 2;
              if (exists(path.join(d, 'ucode/template/themes'))) s += 2;
              if (exists(path.join(d, 'luasrc/view/themes'))) s += 2;
              const mk = path.join(d, 'Makefile');
              if (exists(mk) && /luci-theme|luci\.mk/.test(read(mk))) s += 1;
              if (path.basename(d).startsWith('luci-theme-')) s += 1;
              return s;
            };
            const cands = walkDirs(root, 4).filter(isPkg)
              .map(d => ({ d, s: score(d), depth: path.relative(root, d).split(path.sep).filter(Boolean).length }))
              .sort((a, b) => b.s - a.s || a.depth - b.depth);
            if (!cands.length) stop('Không tìm thấy gói theme LuCI');
            pkg = cands[0].d;
            meta.candidates = cands.map(c => rel(c.d));
            if (cands.length > 1) meta.notes.push('Repo có ' + cands.length + ' gói theme, đang dùng "' + meta.candidates[0] + '". Dùng link .../tree/<nhánh>/<thư mục> để chọn gói khác.');
          }
          meta.pkgPath = rel(pkg);
          ok('Gói theme: ' + meta.pkgPath);

          const mkPath = path.join(pkg, 'Makefile');
          if (exists(mkPath)) {
            const mk = read(mkPath);
            const g = re => { const m = mk.match(re); return m ? m[1].trim() : ''; };
            meta.name = g(/^PKG_NAME\s*[:?]?=\s*(.+)$/m) || path.basename(pkg);
            meta.title = g(/^LUCI_TITLE\s*[:?]?=\s*(.+)$/m);
            meta.deps = g(/^LUCI_DEPENDS\s*[:?]?=\s*(.+)$/m);
            if (/luci\.mk/.test(mk)) ok('Makefile include luci.mk'); else warn('Makefile không include luci.mk');
          } else {
            meta.name = path.basename(pkg);
            warn('Không có Makefile trong gói');
          }

          meta.staticDirs = ls(path.join(pkg, 'htdocs/luci-static')).filter(e => isDirLike(e) && e.name !== 'resources').map(e => e.name);
          meta.tplDirs = [...new Set([...ls(path.join(pkg, 'ucode/template/themes')), ...ls(path.join(pkg, 'luasrc/view/themes'))].filter(isDirLike).map(e => e.name))];
          meta.themeDirs = meta.staticDirs.filter(d => meta.tplDirs.includes(d));
          if (!meta.themeDirs.length) meta.themeDirs = meta.staticDirs;
          if (!meta.themeDirs.length) warn('Không thấy thư mục theme trong htdocs/luci-static');
          const isRealDir = d => { try { return fs.lstatSync(path.join(pkg, 'htdocs/luci-static', d)).isDirectory(); } catch { return false; } };
          const primary = meta.themeDirs.find(isRealDir) || meta.themeDirs[0] || '';
          meta.primary = primary;
          if (exists(path.join(pkg, 'luasrc/view/themes'))) {
            meta.hasLua = true;
            warn('Theme có template Lua (.htm); LuCI 24.10 dùng ucode, cần luci-compat');
          }

          const pjDir = [pkg, root].find(d => exists(path.join(d, 'package.json')));
          if (pjDir) {
            meta.packageJson = rel(pjDir);
            let pj = {};
            try { pj = JSON.parse(read(path.join(pjDir, 'package.json'))); } catch { warn('package.json không đọc được'); }
            const installed = run('npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps', pjDir);
            if (installed) ok('npm install xong (' + meta.packageJson + ')'); else warn('npm install lỗi');
            const script = ['build:css', 'build', 'css', 'sass', 'compile'].find(s => pj.scripts && pj.scripts[s]);
            if (script) {
              meta.buildScript = script;
              if (run('npm run ' + script, pjDir)) ok('npm run ' + script + ' thành công'); else warn('npm run ' + script + ' lỗi');
            }
          }

          const realPrimary = primary ? (() => { try { return fs.realpathSync(path.join(pkg, 'htdocs/luci-static', primary)); } catch { return null; } })() : null;
          const NAMES = ['cascade', 'style', 'main'];
          const scss = walkFiles(root, f => /\.(scss|sass)$/.test(f) && !path.basename(f).startsWith('_'), 6)
            .map(f => ({ f, i: NAMES.indexOf(path.basename(f).replace(/\.(scss|sass)$/, '')), d: path.relative(root, f).split(path.sep).length }))
            .filter(x => x.i >= 0)
            .sort((a, b) => a.i - b.i || a.d - b.d);
          if (scss.length && realPrimary) {
            const entry = scss[0].f;
            const target = path.join(realPrimary, 'cascade.css');
            const nm = pjDir && exists(path.join(pjDir, 'node_modules')) ? ' --load-path=' + q(path.join(pjDir, 'node_modules')) : '';
            const good = run('npx --yes sass --no-source-map' + nm + ' ' + q(entry) + ' ' + q(target), pjDir || path.dirname(entry));
            if (good && exists(target) && fs.statSync(target).size > 0) { meta.compiledFrom = rel(entry); ok('Biên dịch SCSS: ' + rel(entry) + ' → ' + rel(target)); }
            else if (exists(target)) warn('Biên dịch SCSS lỗi, dùng file CSS có sẵn');
            else err('Biên dịch SCSS lỗi và không có CSS dựng sẵn');
          } else if (!scss.length) {
            ok('Không có SCSS, dùng CSS có sẵn trong repo');
          }

          const dest = path.join(OUT, 'pkg');
          for (const d of ['htdocs', 'ucode', 'luasrc', 'root']) {
            if (exists(path.join(pkg, d))) {
              fs.cpSync(path.join(pkg, d), path.join(dest, d), {
                recursive: true,
                verbatimSymlinks: true,
                filter: s => !s.split(path.sep).includes('node_modules'),
              });
            }
          }

          if (!meta.tplDirs.length) err('Không có template header/footer');
          for (const t of meta.tplDirs) {
            for (const [base, ext] of [['ucode/template/themes', 'ut'], ['luasrc/view/themes', 'htm']]) {
              const d = path.join(dest, base, t);
              if (!exists(d)) continue;
              for (const need of ['header', 'footer']) {
                if (exists(path.join(d, need + '.' + ext))) ok(base + '/' + t + '/' + need + '.' + ext);
                else err('Thiếu ' + base + '/' + t + '/' + need + '.' + ext);
              }
            }
          }

          const cssFiles = [];
          for (const d of meta.themeDirs) {
            for (const f of walkFiles(path.join(dest, 'htdocs/luci-static', d), x => x.endsWith('.css'), 3)) {
              let r; try { r = fs.realpathSync(f); } catch { continue; }
              if (!cssFiles.includes(r)) cssFiles.push(r);
            }
          }
          if (!cssFiles.length) err('Không thấy file CSS nào');
          for (const f of cssFiles.slice(0, 6)) {
            const css = read(f);
            const name = path.relative(dest, f);
            const size = fs.statSync(f).size;
            if (size < 1500) warn(name + ' rất nhỏ (' + size + ' byte)'); else ok(name + ': ' + size + ' byte');
          }

          let jsCount = 0;
          for (const f of walkFiles(path.join(dest, 'htdocs'), x => x.endsWith('.js'), 12).slice(0, 400)) {
            jsCount++;
            try { new Function(read(f)); }
            catch (e) {
              const name = path.relative(dest, f);
              if (/import|export/.test(e.message)) warn(name + ': dùng ES module');
              else err(name + ': lỗi cú pháp JS (' + e.message + ')');
            }
          }
          ok('Đã kiểm tra cú pháp ' + jsCount + ' file JS');

          for (const f of walkFiles(path.join(dest, 'root/etc/uci-defaults'), () => true, 1)) {
            const r = spawnSync('sh', ['-n', f]);
            if (r.status === 0) ok('uci-defaults/' + path.basename(f) + ' đúng cú pháp'); else err('uci-defaults/' + path.basename(f) + ' lỗi cú pháp shell');
          }

          save();
          END_PREPARE
          node tools/prepare.mjs src "$SUBDIR" bundle 2>&1 | tee bundle/build.log

      - name: Pack bundle
        if: always()
        run: |
          mkdir -p bundle
          tar -czf bundle.tar.gz -C bundle .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.slug }}
          path: bundle.tar.gz
          retention-days: 3

  # ====================================================================
  # 2. Dựng router giả lập, cài theme, chụp ảnh
  # ====================================================================
  preview:
    needs: [plan, build-theme]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      SLUG: ${{ matrix.slug }}
      REPO: ${{ matrix.repo }}
      REF: ${{ matrix.ref }}
      SUBDIR: ${{ matrix.subdir }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Init helpers and fetch bundle
        run: |
          mkdir -p checks site bundle
          : > checks/oks
          : > checks/errors
          : > checks/warns
          cat > checks/lib.sh <<'END_LIB'
          ok()      { echo "ok: $1"; echo x >> checks/oks; }
          info()    { echo "$1"; echo "- ℹ️ $1" >> "$GITHUB_STEP_SUMMARY"; }
          warn()    { echo "::warning::$1"; echo "- ⚠️ $1" >> "$GITHUB_STEP_SUMMARY"; echo x >> checks/warns; }
          fail()    { echo "::error::$1"; echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"; echo x >> checks/errors; }
          section() { printf '\n## %s\n\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          END_LIB

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bundle-${{ matrix.slug }}
          path: dl

      - name: Extract bundle and report static findings
        id: bundle
        continue-on-error: true
        run: |
          set +e
          source checks/lib.sh
          if [ -f dl/bundle.tar.gz ]; then tar -xzf dl/bundle.tar.gz -C bundle; fi
          section "Theme: $REPO ${REF:+($REF)}"
          if [ ! -f bundle/meta.json ]; then fail "Không có bundle từ job build-theme"; exit 1; fi
          info "Gói: $(jq -r '.pkgPath // "?"' bundle/meta.json) · commit $(jq -r '.sha // "?"' bundle/meta.json | cut -c1-8) · tên: $(jq -r '.name // "?"' bundle/meta.json)"
          jq -r '.notes[]? | "ghi chú: " + .' bundle/meta.json | while read -r n; do info "$n"; done
          err=$(jq -r '.error // empty' bundle/meta.json)
          if [ -n "$err" ]; then fail "$err"; exit 1; fi
          section "Kiểm tra tĩnh của theme"
          jq -r '.[] | [.l, .t] | @tsv' bundle/static.json | while IFS=$'\t' read -r l t; do
            case "$l" in
              ok) ok "$t" ;;
              w) warn "$t" ;;
              e) fail "$t" ;;
            esac
          done
          cp bundle/build.log site/build.log 2>/dev/null
          exit 0

      - name: Install capture tools
        run: |
          mkdir -p tools
          cd tools
          npm init -y >/dev/null
          npm install playwright sharp axe-core
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi

      # ------------------------------------------------------------------
      # Image OpenWrt nền (cache)
      # ------------------------------------------------------------------
      - name: Compute cache key
        id: ck
        run: |
          raw="$CACHE_VERSION|$OWRT_IMAGE|$(date +%G-%V)|$EXTRA_PKGS|$SPOOF_MODEL|$SPOOF_BOARD|$SPOOF_SOC|$SPOOF_TARGET|$SPOOF_HOST|$SPOOF_RAM_MB|${{ hashFiles('.github/workflows/*.yml') }}"
          echo "key=owrt-base-$(echo "$raw" | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore base image cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/owrt-base.tar.gz
          key: ${{ steps.ck.outputs.key }}

      - name: Load cached base image
        id: base_load
        if: steps.cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: docker load -i /tmp/owrt-base.tar.gz

      - name: Build OpenWrt base image
        id: base_build
        if: steps.cache.outputs.cache-hit != 'true' || steps.base_load.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          mkdir -p site
          exec > >(tee site/base_build.log) 2>&1

          docker rm -f base 2>/dev/null
          docker run -d --name base "$OWRT_IMAGE" sleep infinity || exit 1
          docker exec base mkdir -p /var/lock /var/run /usr/libexec/rpcd /usr/share/rpcd/acl.d /etc/crontabs /tmp/hosts

          # Bỏ feed kmods và dùng http
          docker exec base sed -i -e 's#https://#http://#g' -e '/kmods/d' /etc/opkg/distfeeds.conf

          for i in 1 2 3; do
            if docker exec base opkg update; then break; fi
            sleep 4
          done

          docker exec base opkg install luci || exit 1
          docker exec base opkg install luci-compat || true
          for p in $EXTRA_PKGS; do
            docker exec base opkg install "$p" || docker exec base opkg install --force-depends "$p" || true
          done

          # Cấp toàn quyền ubus/uci tránh lỗi Access denied
          cat > full-acl.json <<'END_ACL'
          {
            "unauthenticated": {
              "read": { "ubus": { "*": [ "*" ] }, "uci": [ "*" ] }
            },
            "root": {
              "read":  { "ubus": { "*": [ "*" ] }, "uci": [ "*" ] },
              "write": { "ubus": { "*": [ "*" ] }, "uci": [ "*" ] }
            }
          }
          END_ACL
          docker cp full-acl.json base:/usr/share/rpcd/acl.d/theme-preview-full.json

          # Set mật khẩu root chuẩn
          HASH=$(openssl passwd -1 -salt OpenWrt root)
          docker exec base sed -i "s|^root:[^:]*:|root:$HASH:|g" /etc/shadow

          # --- TẠO SCRIPT GIẢ LẬP SYSTEM CHO RPCD (KHÔNG DÙNG HEREDOC LỖI CÚ PHÁP) ---
          RAM=$((SPOOF_RAM_MB * 1048576))
          FREE=$((RAM * 62 / 100))
          BUF=$((RAM / 40))
          CACHED=$((RAM / 6))
          AVAIL=$((FREE + CACHED / 2))
          TMPKB=$((SPOOF_RAM_MB * 512))
          TMPFREE=$((TMPKB - 1072))

          cat > system_plugin <<'END_SYSPLUGIN'
          #!/bin/sh
          case "$1" in
          list)
            echo '{"info":{},"board":{}}'
            ;;
          call)
            case "$2" in
            info)
              now=$(date +%s)
              cat <<EOF
          {
            "uptime": $((273600 + now % 3600)),
            "localtime": $((now + 25200)),
            "load": [6554, 9830, 7864],
            "memory": {
              "total": __RAM_TOTAL__,
              "free": __RAM_FREE__,
              "shared": 1048576,
              "buffered": __RAM_BUF__,
              "available": __RAM_AVAIL__,
              "cached": __RAM_CACHED__
            },
            "swap": { "total": 0, "free": 0 },
            "root": { "total": 98304, "free": 90112, "used": 8192, "avail": 90112 },
            "tmp": { "total": __TMP_KB__, "free": __TMP_FREE__, "used": 1072, "avail": __TMP_FREE__ }
          }
          EOF
              ;;
            board)
              cat <<EOF
          {
            "kernel": "6.6.65",
            "hostname": "__HOST__",
            "system": "__SOC__",
            "model": "__MODEL__",
            "board_name": "__BOARD__",
            "rootfs_type": "squashfs",
            "release": {
              "distribution": "OpenWrt",
              "version": "24.10.0",
              "revision": "r27300-material3",
              "codename": "",
              "target": "__TARGET__",
              "description": "OpenWrt 24.10.0 r27300"
            }
          }
          EOF
              ;;
            *)
              echo '{}'
              ;;
            esac
            ;;
          esac
          END_SYSPLUGIN

          sed -i \
            -e "s|__RAM_TOTAL__|$RAM|g" -e "s|__RAM_FREE__|$FREE|g" -e "s|__RAM_BUF__|$BUF|g" \
            -e "s|__RAM_AVAIL__|$AVAIL|g" -e "s|__RAM_CACHED__|$CACHED|g" \
            -e "s|__TMP_KB__|$TMPKB|g" -e "s|__TMP_FREE__|$TMPFREE|g" \
            -e "s|__HOST__|$SPOOF_HOST|g" \
            -e "s|__SOC__|$SPOOF_SOC|g" -e "s|__MODEL__|$SPOOF_MODEL|g" \
            -e "s|__BOARD__|$SPOOF_BOARD|g" -e "s|__TARGET__|$SPOOF_TARGET|g" system_plugin

          docker cp system_plugin base:/usr/libexec/rpcd/system
          docker exec base chmod +x /usr/libexec/rpcd/system

          cat > board.json <<'END_BOARD'
          {"model":{"id":"__BOARD__","name":"__MODEL__"},
           "network":{"lan":{"ports":["lan1","lan2","lan3"],"protocol":"static"},
                      "wan":{"device":"wan","protocol":"static"}}}
          END_BOARD
          sed -i -e "s|__BOARD__|$SPOOF_BOARD|g" -e "s|__MODEL__|$SPOOF_MODEL|g" board.json
          docker cp board.json base:/etc/board.json

          cat > network.conf <<'END_NET'
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'fd12:3456:789a::/48'

          config interface 'docker'
              option device 'eth0'
              option proto 'unmanaged'

          config device
              option name 'br-lan'
              option type 'bridge'
              option bridge_empty '1'
              list ports 'lan1'
              list ports 'lan2'
              list ports 'lan3'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '192.168.1.1'
              option netmask '255.255.255.0'
              option ip6assign '60'

          config interface 'wan'
              option device 'wan'
              option proto 'static'
              option ipaddr '203.0.113.2'
              option netmask '255.255.255.0'
              option gateway '203.0.113.1'
              list dns '1.1.1.1'
              list dns '8.8.8.8'

          config route
              option interface 'lan'
              option target '10.10.0.0/24'
              option gateway '192.168.1.254'
          END_NET
          docker cp network.conf base:/etc/config/network

          cat > wireless.conf <<'END_WIFI'
          config wifi-device 'radio0'
              option type 'mac80211'
              option path 'platform/1e140000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0'
              option channel '6'
              option band '2g'
              option htmode 'HE40'
              option country 'VN'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'CR6608-2.4G'
              option encryption 'psk2'
              option key 'OpenWrt@2026'

          config wifi-device 'radio1'
              option type 'mac80211'
              option path 'platform/1e140000.pcie/pci0000:00/0000:00:00.0/0000:01:00.1'
              option channel '36'
              option band '5g'
              option htmode 'HE80'
              option country 'VN'

          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'CR6608-5G'
              option encryption 'psk2'
              option key 'OpenWrt@2026'
          END_WIFI
          docker cp wireless.conf base:/etc/config/wireless

          cat > firewall.conf <<'END_FW'
          config defaults
              option syn_flood '1'
              option input 'ACCEPT'
              option output 'ACCEPT'
              option forward 'REJECT'

          config zone
              option name 'lan'
              list network 'lan'
              option input 'ACCEPT'
              option output 'ACCEPT'
              option forward 'ACCEPT'

          config zone
              option name 'wan'
              list network 'wan'
              option input 'REJECT'
              option output 'ACCEPT'
              option forward 'REJECT'
              option masq '1'
              option mtu_fix '1'

          config forwarding
              option src 'lan'
              option dest 'wan'

          config redirect
              option name 'NAS-HTTPS'
              option src 'wan'
              option dest 'lan'
              option proto 'tcp'
              option src_dport '8443'
              option dest_ip '192.168.1.20'
              option dest_port '443'
              option target 'DNAT'

          config rule
              option name 'Allow-Ping'
              option src 'wan'
              option proto 'icmp'
              option icmp_type 'echo-request'
              option family 'ipv4'
              option target 'ACCEPT'
          END_FW
          docker cp firewall.conf base:/etc/config/firewall

          cat > system.conf <<'END_SYS'
          config system
              option hostname '__HOST__'
              option timezone '<+07>-7'
              option zonename 'Asia/Ho Chi Minh'
              option log_size '64'
              option ttylogin '0'
              option urandom_seed '0'

          config timeserver 'ntp'
              option enabled '1'
              option enable_server '0'
              list server '0.openwrt.pool.ntp.org'
              list server '1.openwrt.pool.ntp.org'
          END_SYS
          sed -i "s|__HOST__|$SPOOF_HOST|g" system.conf
          docker cp system.conf base:/etc/config/system

          cat > setup_base.sh <<'END_SETUP'
          for f in /etc/uci-defaults/*; do
            [ -f "$f" ] || continue
            sh "$f" >/dev/null 2>&1 && rm -f "$f"
          done

          uci add dhcp host
          uci set dhcp.@host[-1].name="nas-storage"
          uci set dhcp.@host[-1].mac="aa:bb:cc:11:22:10"
          uci set dhcp.@host[-1].ip="192.168.1.20"
          uci add dhcp host
          uci set dhcp.@host[-1].name="color-printer"
          uci set dhcp.@host[-1].mac="aa:bb:cc:11:22:11"
          uci set dhcp.@host[-1].ip="192.168.1.30"
          uci add dhcp domain
          uci set dhcp.@domain[-1].name="router.lan"
          uci set dhcp.@domain[-1].ip="192.168.1.1"
          uci commit dhcp

          uci -q get sqm.eth1 >/dev/null || uci set sqm.eth1=queue
          uci set sqm.eth1.enabled=1
          uci set sqm.eth1.interface=wan
          uci set sqm.eth1.download=95000
          uci set sqm.eth1.upload=20000
          uci set sqm.eth1.qdisc=cake
          uci set sqm.eth1.script=piece_of_cake.qos
          uci set sqm.eth1.linklayer=ethernet
          uci set sqm.eth1.overhead=18
          uci commit sqm

          uci set upnpd.config.enabled=1
          uci set upnpd.config.external_iface=wan
          uci set upnpd.config.internal_iface=lan
          uci commit upnpd

          uci set ddns.demo=service
          uci set ddns.demo.enabled=1
          uci set ddns.demo.service_name=duckdns.org
          uci set ddns.demo.lookup_host=demo.duckdns.org
          uci set ddns.demo.domain=demo.duckdns.org
          uci set ddns.demo.username=demo
          uci set ddns.demo.password=secret
          uci set ddns.demo.ip_source=network
          uci set ddns.demo.ip_network=wan
          uci set ddns.demo.interface=wan
          uci set ddns.demo.use_syslog=2
          uci commit ddns

          /etc/init.d/firewall disable
          /etc/init.d/rpcd enable
          /etc/init.d/uhttpd enable
          rm -rf /tmp/luci-*
          END_SETUP
          docker cp setup_base.sh base:/tmp/setup_base.sh
          docker exec base sh /tmp/setup_base.sh || true

          # --- Script chạy daemon không bị conflict mạng ---
          cat > run_services.sh <<'END_RUN'
          #!/bin/sh
          mkdir -p /var/run/ubus /var/lock /tmp/hosts /tmp/run /var/state /tmp/resolv.conf.d
          [ -e /tmp/resolv.conf.d/resolv.conf.auto ] || : > /tmp/resolv.conf.d/resolv.conf.auto

          # Bật cả 2 đầu veth cho lan1-3 và wan để port status báo xanh
          for p in lan1 lan2 lan3 wan; do
            ip link show "$p" >/dev/null 2>&1 || {
              ip link add "$p" type veth peer name "${p}p" 2>/dev/null
              ip link set "$p" up 2>/dev/null
              ip link set "${p}p" up 2>/dev/null
            }
          done

          /sbin/ubusd -s /var/run/ubus/ubus.sock &
          for i in $(seq 1 10); do
            [ -S /var/run/ubus/ubus.sock ] && break
            sleep 1
          done

          /sbin/logd -S 64 &
          /sbin/rpcd -s /var/run/ubus/ubus.sock -t 30 &
          sleep 1
          /sbin/netifd &
          sleep 2
          ubus call network reload 2>/dev/null

          exec /usr/sbin/uhttpd -f -p 0.0.0.0:8080 -h /www -r "CR6608" \
            -x /cgi-bin -u /ubus -U /var/run/ubus/ubus.sock -t 60 -T 30 -n 30 -N 100
          END_RUN
          docker cp run_services.sh base:/run_services.sh
          docker exec base chmod +x /run_services.sh

          docker commit base owrt-base
          docker rm -f base
          docker save owrt-base | gzip -1 > /tmp/owrt-base.tar.gz

      # ------------------------------------------------------------------
      # Chạy router giả lập và cài theme
      # ------------------------------------------------------------------
      - name: Start OpenWrt services
        id: boot
        if: steps.bundle.outcome == 'success' && (steps.base_build.outcome == 'success' || steps.base_load.outcome == 'success')
        continue-on-error: true
        run: |
          docker rm -f owrt >/dev/null 2>&1
          docker run -d --name owrt --privileged -p 8080:8080 owrt-base /run_services.sh
          for i in $(seq 1 30); do
            if docker exec owrt ubus call network.interface.lan status 2>/dev/null | grep -q '"up": true'; then
              echo "netifd và lan interface đã sẵn sàng sau ${i}s"
              break
            fi
            sleep 1
          done
          docker exec owrt ubus list || true

      - name: Install theme into router
        id: theme
        if: steps.boot.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          ex() { docker exec owrt "$@"; }
          P=bundle/pkg
          [ -d "$P" ] || { echo "::error::Không có gói theme trong bundle"; exit 1; }

          themes_of() {
            ex uci -q show luci.themes | sed -n "s/^luci\.themes\.\([A-Za-z0-9_]*\)='\{0,1\}\([^']*\)'\{0,1\}$/\1 \2/p"
          }
          themes_of > checks/themes_before.txt || true

          ex mkdir -p /www /usr/share/ucode/luci /usr/lib/lua/luci
          [ -d "$P/htdocs" ] && docker cp "$P/htdocs/." owrt:/www/
          [ -d "$P/ucode" ]  && docker cp "$P/ucode/." owrt:/usr/share/ucode/luci/
          [ -d "$P/luasrc" ] && docker cp "$P/luasrc/." owrt:/usr/lib/lua/luci/
          [ -d "$P/root" ]   && docker cp "$P/root/." owrt:/
          ex sh -c 'chmod +x /etc/uci-defaults/* 2>/dev/null; true'

          if [ -d "$P/root/etc/uci-defaults" ]; then
            for f in "$P"/root/etc/uci-defaults/*; do
              n=$(basename "$f")
              echo "uci-defaults: $n"
              ex sh "/etc/uci-defaults/$n" && ex rm -f "/etc/uci-defaults/$n" || echo "::warning::uci-defaults $n chạy lỗi"
            done
          fi

          themes_of > checks/themes_after.txt || true
          awk 'NR==FNR{b[$1]=1;next} !($1 in b)' checks/themes_before.txt checks/themes_after.txt > checks/themes_new.txt

          if [ ! -s checks/themes_new.txt ]; then
            for d in $(jq -r '.themeDirs[]?' bundle/meta.json); do
              nm=$(echo "$d" | tr -cd 'A-Za-z0-9_')
              [ -n "$nm" ] || continue
              ex uci set "luci.themes.$nm=/luci-static/$d"
              echo "$nm /luci-static/$d" >> checks/themes_new.txt
            done
            ex uci commit luci
          fi

          primary=$(jq -r '.primary // empty' bundle/meta.json)
          if [ -n "$primary" ]; then
            { grep " /luci-static/$primary\$" checks/themes_new.txt; grep -v " /luci-static/$primary\$" checks/themes_new.txt; } > checks/themes_sorted.txt || true
            [ -s checks/themes_sorted.txt ] && mv checks/themes_sorted.txt checks/themes_new.txt
          fi

          head -n "$MAX_THEMES" checks/themes_new.txt \
            | jq -Rsc 'split("\n") | map(select(length > 0) | split(" ")) | map({name: .[0], path: .[1], dir: (.[1] | split("/") | last)})' \
            > checks/themes.json
          echo "Themes sẽ chụp:"
          cat checks/themes.json
          [ "$(jq length checks/themes.json)" -gt 0 ] || { echo "::error::Không có theme nào để chụp"; exit 1; }

          ex sh -c 'rm -rf /tmp/luci-*'

      - name: Seed demo data and wait for LuCI
        id: ready
        if: steps.theme.outcome == 'success'
        continue-on-error: true
        run: |
          now=$(date +%s)
          exp=$((now + 43200))
          cat > dhcp.leases <<EOF
          $exp aa:bb:cc:11:22:01 192.168.1.101 pixel-8-pro *
          $exp aa:bb:cc:11:22:02 192.168.1.102 macbook-pro-m3 *
          $exp aa:bb:cc:11:22:03 192.168.1.103 lg-smart-tv *
          $exp aa:bb:cc:11:22:10 192.168.1.20 nas-storage *
          EOF
          docker cp dhcp.leases owrt:/tmp/dhcp.leases

          cat > seed.sh <<'END_SEED'
          #!/bin/sh
          for e in "192.168.1.101 aa:bb:cc:11:22:01" "192.168.1.102 aa:bb:cc:11:22:02" "192.168.1.103 aa:bb:cc:11:22:03" "192.168.1.20 aa:bb:cc:11:22:10"; do
            set -- $e
            ip neigh replace "$1" lladdr "$2" dev br-lan nud permanent 2>/dev/null
          done
          logger -p kern.info -t kernel "br-lan: port 1(lan1) entered forwarding state"
          logger -p daemon.info -t netifd "Interface 'lan' is now up"
          logger -p daemon.notice -t netifd "Interface 'wan' is now up"
          logger -p daemon.info -t dnsmasq-dhcp "DHCPACK(br-lan) 192.168.1.101 aa:bb:cc:11:22:01 pixel-8-pro"
          logger -p authpriv.notice -t dropbear "Password auth succeeded for root from 192.168.1.101:51234"
          END_SEED
          docker cp seed.sh owrt:/tmp/seed.sh
          docker exec owrt sh /tmp/seed.sh || true

          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/cgi-bin/luci/ || true)
            echo "try $i: HTTP $code"
            case "$code" in
              200|302|403) echo "LuCI up thành công"; exit 0 ;;
            esac
            sleep 2
          done
          docker exec owrt ps || true
          docker logs owrt 2>&1 | tail -n 40 || true
          exit 1

      # ------------------------------------------------------------------
      # Kiểm tra runtime router
      # ------------------------------------------------------------------
      - name: Runtime checks
        if: steps.ready.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          source checks/lib.sh
          section "Kiểm tra trên router giả lập"
          U=http://127.0.0.1:8080
          ex() { docker exec owrt "$@"; }

          info "Giả lập: $SPOOF_MODEL"

          for s in ubusd rpcd uhttpd netifd logd; do
            if ex ps | grep -q "[/ ]$s"; then ok "Dịch vụ $s đang chạy"; else fail "Dịch vụ $s không chạy"; fi
          done

          if ex ubus call system board | grep -q "$SPOOF_BOARD"; then ok "ubus system board báo $SPOOF_MODEL"; else fail "ubus system board không trả dữ liệu"; fi
          if ex ubus call system info | grep -q '"uptime"'; then ok "ubus system info trả dữ liệu RAM/CPU"; else fail "ubus system info không trả dữ liệu"; fi
          if ex ubus call luci-rpc getDHCPLeases | grep -q pixel-8-pro; then ok "DHCP lease giả hiển thị qua luci-rpc"; else warn "Không thấy DHCP lease giả"; fi

      # ------------------------------------------------------------------
      # Chụp ảnh Playwright
      # ------------------------------------------------------------------
      - name: Capture and check pages
        if: steps.ready.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p site/shots
          cat > tools/capture.mjs <<'END_CAPTURE'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const ORIGIN = 'http://127.0.0.1:8080';
          const BASE = ORIGIN + '/cgi-bin/luci';
          const USER = 'root';
          const PASS = 'root';
          const MAX_H = 12000;
          const AXE = process.env.CHECK_CONTRAST === 'true' ? require.resolve('axe-core') : null;
          const readJson = (p, d) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return d; } };

          const THEMES = readJson('checks/themes.json', []).filter(t => /^\/[A-Za-z0-9_\-./]+$/.test(t.path));
          const DEVICES = { desktop: { width: 1366, height: 850 }, mobile: { width: 390, height: 844 } };
          const SCHEMES = ['light', 'dark'];
          const QUICK = new Set(['overview', 'interfaces', 'wireless', 'firewall', 'system', 'syslog']);

          const ALL_PAGES = [
            ['overview',     'Overview',          'Status',     '/admin/status/overview'],
            ['routes',       'Routing',           'Status',     '/admin/status/routes'],
            ['syslog',       'System Log',        'Status',     '/admin/status/logs'],
            ['processes',    'Processes',         'Status',     '/admin/status/processes'],
            ['realtime',     'Realtime Graphs',   'Status',     '/admin/status/realtime'],
            ['interfaces',   'Interfaces',        'Network',    '/admin/network/network'],
            ['iface-modal',  'Edit interface',    'Network',    '/admin/network/network',
              async (p) => {
                const btn = p.locator('.cbi-button-edit, button:has-text("Edit")').first();
                if (!(await btn.count())) return false;
                await btn.click({ timeout: 5000 });
                await p.waitForSelector('.modal', { timeout: 5000 });
                await p.waitForTimeout(700);
              }],
            ['wireless',     'Wireless',          'Network',    '/admin/network/wireless'],
            ['dhcp',         'DHCP and DNS',      'Network',    '/admin/network/dhcp'],
            ['firewall',     'Firewall zones',    'Network',    '/admin/network/firewall'],
            ['sqm',          'SQM QoS',           'Network',    '/admin/network/sqm'],
            ['diagnostics',  'Diagnostics',       'Network',    '/admin/network/diagnostics'],
            ['system',       'System',            'System',     '/admin/system/system'],
            ['admin',        'Administration',    'System',     '/admin/system/admin'],
            ['packages',     'Software',          'System',     '/admin/system/package-manager'],
            ['startup',      'Startup',           'System',     '/admin/system/startup'],
            ['flash',        'Backup / Flash',    'System',     '/admin/system/flash'],
            ['upnp',         'UPnP',              'Services',   '/admin/services/upnp'],
            ['ddns',         'Dynamic DNS',       'Services',   '/admin/services/ddns'],
            ['wol',          'Wake on LAN',       'Services',   '/admin/services/wol'],
          ];
          const PAGES = process.env.PROFILE === 'quick' ? ALL_PAGES.filter(p => QUICK.has(p[0])) : ALL_PAGES;

          const manifest = [];
          const fresh = () => ({ js: [], bad: [], failed: [], console: [] });

          function setTheme(t) {
            execFileSync('docker', ['exec', 'owrt', 'sh', '-c',
              "uci set luci.main.mediaurlbase='" + t.path + "' && uci commit luci && rm -rf /tmp/luci-*"]);
          }

          async function launch() {
            try { return await chromium.launch({ channel: 'chrome' }); }
            catch (e) { return await chromium.launch(); }
          }

          async function settle(page, extra = 900) {
            await page.waitForFunction(() => !document.querySelector('.spinning'), null, { timeout: 8000 }).catch(() => {});
            await page.evaluate(() => document.fonts.ready).catch(() => {});
            await page.waitForTimeout(extra);
          }

          async function fillLogin(page, pass) {
            const pwd = page.locator('input[type="password"]').first();
            await pwd.waitFor({ state: 'visible', timeout: 15000 });
            const user = page.locator('input[name="luci_username"], input[type="text"]').first();
            if (await user.count()) await user.fill(USER);
            await pwd.fill(pass);
            return pwd;
          }

          async function submitLogin(page, pwd) {
            const btn = page.locator('button[type="submit"], input[type="submit"], .cbi-button-positive, .cbi-button-login, .cbi-button-apply').first();
            if (await btn.count()) await btn.click();
            else await pwd.press('Enter');
          }

          async function login(page) {
            await page.goto(BASE + '/', { waitUntil: 'domcontentloaded' });
            const pwd = await fillLogin(page, PASS);
            await submitLogin(page, pwd);
            await page.locator('input[type="password"]').first().waitFor({ state: 'detached', timeout: 20000 });
            await settle(page, 800);
          }

          async function record(page, o) {
            const issues = [];
            const add = (l, t) => issues.push({ l, t });
            const isLogin = o.kind === 'login';

            const info = await page.evaluate(async (dir) => {
              await document.fonts.ready;
              const sheets = [...document.styleSheets].map(s => s.href || '').filter(Boolean);
              const main = document.querySelector('#maincontent, main, .main');
              return {
                title: document.title,
                hasTheme: sheets.some(h => h.includes('/' + dir + '/')),
                fontsErr: [...document.fonts].filter(f => f.status === 'error').map(f => f.family),
                hasLogin: !!document.querySelector('input[name="luci_password"]'),
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                textLen: (main ? main.innerText : document.body.innerText).trim().length,
                head: document.body.innerText.slice(0, 2500),
                hasL: typeof window.L !== 'undefined',
                bg: getComputedStyle(document.body).backgroundColor,
                height: document.documentElement.scrollHeight,
              };
            }, o.theme.dir);

            if (!info.hasTheme) add('e', 'Không nạp CSS từ /' + o.theme.dir + '/');
            if (!isLogin && !info.hasL) add('e', 'ReferenceError: L is not defined');
            if (!isLogin && info.hasLogin) add('e', 'Mất phiên đăng nhập');
            if (info.textLen < 20) add('e', 'Nội dung trang trống');
            if (/Failed to load template|Unable to compile|Syntax error|Reference error|Runtime error|RPC call failed/i.test(info.head))
              add('e', 'Trang hiển thị lỗi LuCI/ucode');
            for (const f of info.fontsErr) add('e', 'Font không nạp được: ' + f);
            for (const t of o.bag.js) add('e', 'JS: ' + t);
            for (const t of o.bag.bad) add('e', 'Tài nguyên lỗi: ' + t);
            for (const t of o.bag.failed) add('e', 'Request fail: ' + t);

            const name = o.theme.name.toLowerCase() + '-' + o.id + '-' + o.device + '-' + o.scheme;
            const vw = DEVICES[o.device].width;
            const shotOpts = info.height > MAX_H
              ? { fullPage: true, clip: { x: 0, y: 0, width: vw, height: MAX_H } }
              : { fullPage: true };
            const buf = await page.screenshot(shotOpts);
            const meta = await sharp(buf).metadata();
            await sharp(buf).webp({ quality: 82 }).toFile('site/shots/' + name + '.webp');
            await sharp(buf).resize(480, 360, { fit: 'cover', position: 'top' }).webp({ quality: 72 }).toFile('site/shots/' + name + '-t.webp');

            manifest.push({
              theme: o.theme.name, id: o.id, title: o.title, group: o.group, device: o.device, scheme: o.scheme,
              w: meta.width, h: meta.height, bg: info.bg,
              full: 'shots/' + name + '.webp', thumb: 'shots/' + name + '-t.webp', issues,
            });
          }

          async function run(browser, theme, device, scheme) {
            const ctx = await browser.newContext({ viewport: DEVICES[device], colorScheme: scheme });
            const page = await ctx.newPage();
            let bag = fresh();
            page.on('console', m => {
              const t = m.text();
              if (m.type() === 'error' && !t.startsWith('Failed to load resource')) bag.console.push(t.slice(0, 200));
            });
            page.on('pageerror', e => bag.js.push(String(e.message).slice(0, 200)));
            page.on('requestfailed', r => {
              const why = (r.failure() && r.failure().errorText) || '';
              if (!why.includes('ERR_ABORTED')) bag.failed.push(r.url().replace(ORIGIN, '') + ' (' + why + ')');
            });
            page.on('response', r => {
              if (r.status() >= 400 && r.url().startsWith(ORIGIN) && !r.request().isNavigationRequest())
                bag.bad.push(r.status() + ' ' + r.url().replace(ORIGIN, ''));
            });

            bag = fresh();
            const r0 = await page.goto(BASE + '/', { waitUntil: 'domcontentloaded' });
            await settle(page, 800);
            await record(page, { theme, id: 'login', title: 'Login', group: 'Auth', device, scheme, resp: r0, expect: [200, 403], bag, kind: 'login' });

            try {
              await login(page);
            } catch (e) {
              console.log('::error::Đăng nhập thất bại: ' + e.message.split('\n')[0]);
              fs.appendFileSync('checks/errors', 'x\n');
              await ctx.close();
              return;
            }

            for (const [id, title, group, path, action] of PAGES) {
              try {
                bag = fresh();
                const resp = await page.goto(BASE + path, { waitUntil: 'domcontentloaded' });
                await settle(page, id === 'realtime' ? 3000 : 900);
                if (action) {
                  try { await action(page, device); } catch (e) {}
                }
                await record(page, { theme, id, title, group, device, scheme, resp, expect: [200], bag });
              } catch (e) {
                console.log('::warning::' + id + ': ' + e.message.split('\n')[0]);
              }
            }
            await ctx.close();
          }

          const browser = await launch();
          try {
            for (const theme of THEMES) {
              setTheme(theme);
              for (const device of Object.keys(DEVICES)) {
                for (const scheme of SCHEMES) {
                  await run(browser, theme, device, scheme);
                }
              }
            }
          } finally {
            await browser.close().catch(() => {});
            const staticF = readJson('bundle/static.json', []);
            const bmeta = readJson('bundle/meta.json', {});
            const meta = {
              slug: process.env.SLUG, repo: process.env.REPO, ref: process.env.REF,
              model: process.env.SPOOF_MODEL, board: process.env.SPOOF_BOARD,
              themes: THEMES.map(t => ({ name: t.name, path: t.path })),
              generated: new Date().toISOString(),
            };
            const summary = {
              total: manifest.length,
              errors: manifest.reduce((acc, m) => acc + m.issues.filter(i => i.l === 'e').length, 0),
              warns: manifest.reduce((acc, m) => acc + m.issues.filter(i => i.l === 'w').length, 0),
            };
            fs.writeFileSync('site/manifest.json', JSON.stringify({ summary, meta, items: manifest }));
          }
          END_CAPTURE
          node tools/capture.mjs

      # ------------------------------------------------------------------
      # Album UI
      # ------------------------------------------------------------------
      - name: Build album UI
        if: always()
        run: |
          mkdir -p site
          cat > site/index.html <<'END_ALBUM'
          <!DOCTYPE html>
          <html lang="vi"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Theme preview</title>
          <style>
          :root{--bg:#fef7ff;--sf:#f3edf7;--fg:#1d1b20;--mut:#49454f;--pri:#6750a4;--onpri:#fff;--bd:#cac4d0;--warn:#b26a00;--err:#b3261e}
          @media(prefers-color-scheme:dark){:root{--bg:#141218;--sf:#211f26;--fg:#e6e0e9;--mut:#cac4d0;--pri:#d0bcff;--onpri:#381e72;--bd:#49454f;--warn:#ffb951;--err:#f2b8b5}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
          header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 20px}
          h1{font-size:20px;margin:0 0 4px}
          #meta,#sum{color:var(--mut);font-size:13px}
          .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
          .seg{display:inline-flex;border:1px solid var(--bd);border-radius:20px;overflow:hidden}
          button{font:inherit;color:var(--fg);background:none;border:0;padding:6px 14px;cursor:pointer}
          .seg button.on,.chip.on{background:var(--pri);color:var(--onpri)}
          .chip{border:1px solid var(--bd);border-radius:16px;padding:4px 12px}
          main{padding:8px 20px 40px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
          .card{background:var(--sf);border-radius:16px;overflow:hidden;cursor:pointer;border:2px solid transparent}
          .card:hover{border-color:var(--pri)}
          .card img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block;background:var(--bd)}
          .meta{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between}
          #lb{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;z-index:10;color:#fff}
          #lb.open{display:flex}
          .lbbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#000a}
          .lbimg{flex:1;overflow:auto;text-align:center;padding:12px}
          .lbimg img{max-width:100%;height:auto;border-radius:8px}
          </style></head><body>
          <header>
            <h1 id="title">Theme preview</h1>
            <div id="meta"></div>
            <div id="sum"></div>
            <div class="bar">
              <span class="seg" id="fDevice"></span>
              <span class="seg" id="fScheme"></span>
            </div>
          </header>
          <main id="main"><div class="grid" id="grid"></div></main>
          <div id="lb">
            <div class="lbbar">
              <button id="close">✕ Đóng</button>
              <strong id="lbtitle"></strong>
            </div>
            <div class="lbimg"><img id="lbpic" alt=""></div>
          </div>
          <script>
          const $ = s => document.querySelector(s);
          let data = [];
          fetch('manifest.json').then(r => r.json()).then(d => {
            data = d.items;
            $('#meta').textContent = d.meta.model + ' (' + d.meta.board + ')';
            $('#sum').textContent = d.summary.total + ' ảnh · ' + d.summary.errors + ' lỗi · ' + d.summary.warns + ' cảnh báo';
            render();
          });
          function render() {
            $('#grid').innerHTML = data.map((x, i) => `
              <div class="card" onclick="openLb(${i})">
                <img loading="lazy" src="${x.thumb}">
                <div class="meta"><span>${x.title}</span><small>${x.device} · ${x.scheme}</small></div>
              </div>`).join('');
          }
          window.openLb = function(i) {
            const x = data[i];
            $('#lbpic').src = x.full;
            $('#lbtitle').textContent = x.title;
            $('#lb').classList.add('open');
          };
          $('#close').onclick = () => $('#lb').classList.remove('open');
          </script></body></html>
          END_ALBUM

      - name: Diagnostics and fallback page
        if: always()
        run: |
          mkdir -p site
          {
            echo "=== trạng thái các bước ==="
            echo "boot:   ${{ steps.boot.outcome }}"
            echo "theme:  ${{ steps.theme.outcome }}"
            echo "ready:  ${{ steps.ready.outcome }}"
            echo "=== ps ===";            docker exec owrt ps
            echo "=== ubus objects ===";  docker exec owrt ubus list
            echo "=== system board ===";  docker exec owrt ubus call system board
            echo "=== system info ===";   docker exec owrt ubus call system info
            echo "=== http ===";          curl -is -m 10 http://127.0.0.1:8080/cgi-bin/luci/ | head -n 20
          } > site/diagnostics.txt 2>&1 || true
          cat site/diagnostics.txt

          if [ ! -f site/manifest.json ]; then
            cat > site/index.html <<'EOF'
            <!DOCTYPE html><meta charset="utf-8"><title>Preview failed</title>
            <body style="font-family:system-ui;max-width:900px;margin:24px auto;padding:0 16px">
            <h1>Preview chưa tạo được</h1>
            <pre style="white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px">Xem file diagnostics.txt để biết chi tiết lỗi.</pre>
            </body>
          EOF
          fi

          ok=false
          [ -f site/manifest.json ] && ok=true
          jq -n --arg slug "$SLUG" --arg repo "$REPO" --arg ref "$REF" \
                --arg sha "$(jq -r '.sha // ""' bundle/meta.json 2>/dev/null)" \
                --argjson ok "$ok" \
                '{slug: $slug, repo: $repo, ref: $ref, sha: $sha, ok: $ok}' > site/meta.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.slug }}
          path: site
          retention-days: 3

  # ====================================================================
  # 3. Gộp preview và deploy Pages
  # ====================================================================
  publish:
    needs: [plan, preview]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: sites

      - name: Prepare Pages directory
        run: |
          mkdir -p deploy
          for d in sites/site-*; do
            [ -d "$d" ] || continue
            slug=${d#sites/site-}
            cp -a "$d" "deploy/$slug"
          done
          # Copy preview đầu tiên làm trang chính
          first=$(ls -d deploy/*/ | head -n1)
          if [ -d "$first" ]; then cp -a "$first"* deploy/; fi
          touch deploy/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
