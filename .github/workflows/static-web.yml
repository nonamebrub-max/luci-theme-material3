name: Build and Deploy LuCI Theme M3

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Compile SCSS
        run: |
          npm install
          mkdir -p dist/luci-static/material3
          npx sass styles/cascade.scss dist/luci-static/material3/cascade.css --no-source-map

      - name: Copy full htdocs assets
        run: |
          if [ -d "htdocs" ]; then
            cp -r htdocs/* dist/
          fi

      - name: Process original ucode template to HTML
        run: |
          # Copy file template đăng nhập gốc
          if [ -f "ucode/template/themes/material3/sysauth.ut" ]; then
            cp ucode/template/themes/material3/sysauth.ut dist/index.html
            
            # Thay thế các biến/cú pháp ucode động thành giá trị tĩnh để trình duyệt render được trực tiếp
            sed -i 's/{{ pcdata(striptags(boardinfo.hostname)) }}/footstrap-playground/g' dist/index.html
            sed -i 's/{{ media }}/.\/luci-static\/material3/g' dist/index.html
            sed -i 's/{{ resource }}/.\/luci-static\/resources/g' dist/index.html
            sed -i 's/{% if (FSM_URL) { %}/ /g' dist/index.html
            sed -i 's/{% } %}/ /g' dist/index.html
          else
            echo "Template not found!" >&2
            exit 1
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
